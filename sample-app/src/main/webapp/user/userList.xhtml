<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/layout.xhtml">
  <ui:define name="title">ユーザー一覧</ui:define>
  <ui:define name="content">
    <h:form id="searchForm">
      <h:inputText id="keyword" value="#{userListBean.keyword}"/>
      <h:commandButton value="検索" action="#{userListBean.search}">
        <f:ajax execute="@form" render="userTable"/>
      </h:commandButton>
      <h:dataTable id="userTable" value="#{userListBean.users}" var="u">
        <h:column>
          <f:facet name="header">氏名</f:facet>
          #{u.name}
        </h:column>
        <h:column>
          <h:commandLink value="編集" action="#{userListBean.edit(u.id)}"/>
          <h:commandLink value="削除" actionListener="#{userListBean.delete(u)}"
                         onclick="return confirm('削除しますか？');"/>
        </h:column>
      </h:dataTable>
      <h:outputText value="#{userListBean.users.size()} 件" rendered="#{not empty userListBean.users}"/>
    </h:form>
  </ui:define>
</ui:composition>

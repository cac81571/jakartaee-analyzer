<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head><title>ログイン</title></h:head>
<h:body>
  <h:form id="loginForm">
    <h:outputLabel for="loginId" value="ログインID"/>
    <h:inputText id="loginId" value="#{loginBean.loginId}" required="true"/>
    <h:inputSecret id="password" value="#{loginBean.password}" required="true"/>
    <h:commandButton value="ログイン" action="#{loginBean.login}"/>
  </h:form>
</h:body>
</html>
